[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rustigc-py"
dynamic = ["version"]
authors = [
  { name="Jerome Brunet", email="jbrun3t@gmail.com" },
]
description = "Python bindings for the rustigc library"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later WITH Classpath-exception-2.0"
license-files = ["LICENSE"]
keywords = ["igc", "gliding", "paragliding", "parser"]
dependencies = ["numpy>=1.20", "timezonefinder>=6.5", "tzdata; sys_platform == 'win32'"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.11",
    "pytest>=7.0",
    "mypy>=1.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0"
]

[project.urls]
Homepage = "https://github.com/jbrun3t/rustigc"
Issues = "https://github.com/jbrun3t/rustigc/issues"

[tool.maturin]
python-source = "python"
module-name = "rustigc_py._bindings"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=rustigc_py",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
