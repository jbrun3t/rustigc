[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rustigcpy-wrapper"
version = "0.1.0"
description = "High-level Python wrapper for rustigcpy IGC parser"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["igc", "gliding", "paragliding", "parser"]
dependencies = [
    "rustigcpy>=0.1.0",
    "numpy>=1.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rustigcpy_wrapper"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=rustigcpy_wrapper",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

