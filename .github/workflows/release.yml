name: Release

# A tag runs the normal build, then publishes what it produced. Everything is built, tested and
# packaged by `build.yml`, exactly as it is on any other ref; this workflow only checks the tag
# makes sense, then collects the artifacts and uploads them.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # a release
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # a rehearsal, e.g. v0.0.4-rc1

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      prerelease: ${{ contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7

      # The four copies kept by hand.
      - name: Version and Tag Check
        run: |
          version=${GITHUB_REF_NAME#v}   # the trigger admits only vX.Y.Z and vX.Y.Z-<suffix>
          version=${version%%-*}
          status=0

          check() {
            if [ "$2" = "$version" ]; then
              echo "ok      $1"
            else
              echo "::error file=$1::declares $2, tag says $version"
              status=1
            fi
          }

          check Cargo.toml "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          for manifest in rustigc-wasm/package.json \
                          rustigc-wasm/utils/package.json \
                          rustigc-wasm/score/package.json; do
            check "$manifest" "$(jq -r .version "$manifest")"
          done

          exit "$status"

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml


  github-release:
    name: GitHub release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      # An RC gets a release too, marked as one, so its artifacts can be inspected.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            ${{ needs.preflight.outputs.prerelease == 'true' && '--prerelease' || '--latest' }} \
            assets/*

  crates-io:
    name: crates.io
    needs: [preflight, build, github-release]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install cargo-release
        env:
          CARGO_RELEASE_VERSION: '1.1.5'
        run: |
          curl -fsSL "https://github.com/crate-ci/cargo-release/releases/download/v$CARGO_RELEASE_VERSION/cargo-release-v$CARGO_RELEASE_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.cargo/bin" ./cargo-release

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo release publish --workspace \
            --exclude rustigc-py --exclude rustigc-wasm \
            --allow-branch HEAD --no-confirm --execute

  pypi:
    name: PyPI
    needs: [preflight, build, github-release]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: dist
          name: sdist

      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: npm
    needs: [preflight, build, github-release]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: npm
          name: npm-packages

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: |
          for tarball in ./npm/*.tgz; do
            npm publish "$tarball"
          done
