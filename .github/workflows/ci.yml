name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features

  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Build Python bindings
        run: |
          source venv/bin/activate
          cd rustigc-py
          pip install .[dev]

      - name: Run Python tests
        run: |
          source venv/bin/activate
          cd rustigc-py
          python -m pytest -v

  wasm:
    name: WASM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build wasm bindings
        run: wasm-pack build rustigc-wasm --target web --dev

      - name: Build the npm packages
        run: |
          cd rustigc-wasm
          npm install
          npm run build

      - name: Smoke test the CLI against a blessed fixture
        run: |
          cd rustigc-wasm
          node score/dist/rustigc-wasm-score.js --league xcontest \
            < ../test_data/real/fai-01.igc | grep -q '996.56 points, 622.85 km'

