name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # rustup ships on every runner image, so the official installer is already here. It also
      # pins one toolchain across the matrix: the preinstalled Rust differs between images.
      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install the Python bindings and their tools
        working-directory: rustigc-py
        run: pip install '.[dev]'

      - name: Run ruff
        working-directory: rustigc-py
        run: |
          ruff check .
          ruff format --check .

      - name: Run mypy
        working-directory: rustigc-py
        run: mypy

      # Don't like having locks checked in
      # Let's just record it in case we need it later
      - uses: actions/upload-artifact@v7
        with:
          name: Cargo.lock
          path: Cargo.lock
          retention-days: 7

  build:
    uses: ./.github/workflows/build.yml
