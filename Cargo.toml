[workspace]
members = ["rustigc",
	   "rustigc-test-data",
	   "rustigc-tools",
	   "rustigc-py",
	   "rustigc-wasm"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.88"
license = "GPL-2.0-or-later WITH Classpath-exception-2.0"
authors = ["Jerome Brunet <jbrun3t@gmail.com>"]
repository = "https://github.com/jbrun3t/rustigc"
keywords = ["igc", "soaring", "aviation", "gps"]
categories = ["parser-implementations", "aerospace"]

# Optimization settings for release builds (minimizes binary & WASM size)
[profile.release]
codegen-units = 1  # Allows LLVM to perform cross-module inlining and optimizations
opt-level = "z"    # Optimize aggressively for binary size
lto = true         # Link-Time Optimization for cross-crate dead code elimination
panic = "abort"    # Strips unwinding/landing pads (saves ~10-20% size; does not affect Result/JsError)
strip = true       # Strip debug symbols from the binary

[profile.profiling]
inherits = "release"
lto = "thin"
debug = true             # Full debug info for symbols
strip = false           # Don't strip symbols
