[workspace]
members = ["rustigc",
	   "rustigc-test-data",
	   "rustigc-tools",
	   "rustigc-py",
	   "rustigc-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-or-later WITH Classpath-exception-2.0"
authors = ["Jerome Brunet <jbrun3t@gmail.com>"]
repository = "https://github.com/jbrun3t/rustigc"
keywords = ["igc", "soaring", "aviation", "gps"]
categories = ["parser-implementations", "aerospace"]

# Important so LLVM properly re-partition inlining
[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
lto = "thin"
strip = false
panic = "unwind"
debug = true
