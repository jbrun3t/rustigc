[package]
name = "rustigc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "IGC flight log parsing and cross-country scoring"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
geojson = ["dep:geojson"]

[dependencies]
btoi = "0.5"
geographiclib-rs = "0.2"
geojson = { version = "1.0", default-features = false, optional = true }
log = "0.4"
num-traits = "0.2"
rstar = "0.13"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
thiserror = "2"
winnow = "1"

[dev-dependencies]
pretty_assertions = "1"
criterion = "0.8"
rustigc-test-data = { path = "../rustigc-test-data", version = "0.2.0" }


# `cargo test -p rustigc` skips `export`, where a workspace-wide run gets `geojson` from the bindings.
[[test]]
name = "export"
required-features = ["geojson"]

[[bench]]
name = "benches"
harness = false
