[package]
name = "rustigc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "IGC file parser library"
readme = "README.md"

[features]
crazy-test = []

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"], optional = true }
winnow = "0.7"
thiserror = "2.0"
num-traits = "0.2"
btoi = "0.4"
rustc-hash = "1.1"
geographiclib-rs = "0.2"
rstar = "0.12"
smallvec = "1.15"

[dev-dependencies]
pretty_assertions = "1"
criterion = "0.5"
serde_json = "1"
# Enable serdes while testing
rustigc = { path = ".", features = ["serde"] }

[[bench]]
name = "benches"
harness = false
