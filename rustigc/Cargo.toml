[package]
name = "rustigc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "IGC flight log parsing and cross-country scoring"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["serde", "presets"]
# The rules are data, so serde itself is not optional. This gates only the derives on the public
# types — parsed records, flights, `ScoringResult` — which a caller may not want.
serde = []
# The rulesets under `src/score/rules/rulesets/`, embedded. Without it, a ruleset comes from
# `Ruleset::from_json`.
presets = []
geojson = ["dep:geojson"]

[dependencies]
btoi = "0.5"
geographiclib-rs = "0.2"
geojson = { version = "1.0", default-features = false, optional = true }
log = "0.4"
num-traits = "0.2"
rstar = "0.13"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
thiserror = "2"
winnow = "1"

[dev-dependencies]
pretty_assertions = "1"
criterion = "0.8"
rustigc-test-data = { path = "../rustigc-test-data", version = "0.1.1" }


# `scoring`, `export` and the benches read the library through its optional serializers and
# presets. Those are on by default, so this only bites a `--no-default-features` run, which skips
# them rather than failing to compile them.
[[test]]
name = "scoring"
required-features = ["serde", "presets"]

[[test]]
name = "export"
required-features = ["serde", "geojson", "presets"]

[[bench]]
name = "benches"
harness = false
required-features = ["presets"]
