[package]
name = "rustigc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "IGC flight log parsing and cross-country scoring"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["serde", "geojson", "cfd-preview" ]
cfd-preview = []
geojson = ["dep:geojson"]

[dependencies]
btoi = "0.5"
geographiclib-rs = "0.2"
geojson = { version = "1.0", default-features = false, optional = true }
log = "0.4"
num-traits = "0.2"
rstar = "0.13"
rustc-hash = "2"
serde = { version = "1", features = ["derive"], optional = true }
smallvec = "1"
thiserror = "2"
winnow = "1"

[dev-dependencies]
pretty_assertions = "1"
criterion = "0.8"
rustigc-test-data = { path = "../rustigc-test-data", version = "0.1.0" }
serde_json = "1"


# `scoring` and `export` read the library through its optional serializers. Those are on by
# default, so this only bites a `--no-default-features` run, which skips the two suites rather
# than failing to compile them.
[[test]]
name = "scoring"
required-features = ["serde"]

[[test]]
name = "export"
required-features = ["serde", "geojson"]

[[bench]]
name = "benches"
harness = false
