[package]
name = "rustigc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "IGC file parser library"
readme = "README.md"
repository = "https://github.com/jbrun3t/rustigc"
authors = ["Jerome Brunet <jbrun3t@gmail.com>"]
keywords = ["igc", "soaring", "aviation", "gps"]
categories = ["parser-implementations", "aerospace"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
winnow = "0.7"
thiserror = "2.0"
num-traits = "0.2"

[dev-dependencies]
pretty_assertions = "1"
