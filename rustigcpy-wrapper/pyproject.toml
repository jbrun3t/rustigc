[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rustigcpy-wrapper"
version = "0.1.0"
description = "High-level Python wrapper for rustigcpy IGC parser"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["igc", "gliding", "paragliding", "parser"]
dependencies = [
    "rustigcpy>=0.1.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
