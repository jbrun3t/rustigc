[package]
name = "rustigc-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "WASM bindings for rustigc IGC parser"
readme = "README.md"

[lib]
name = "rustigc"
crate-type = ["cdylib"]

[dependencies]
rustigc = { path = "../rustigc", features = ["serde", "geojson"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde_json = "1"

# Configure wasm-opt when building with wasm-pack
[package.metadata.wasm-pack.profile.release]
# -Oz optimizes for size; -all enables WebAssembly features (bulk-memory, etc.) required by rustc
wasm-opt = ["-Oz", "-all"]


